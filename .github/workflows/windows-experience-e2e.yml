name: Windows Real Video and Viewing Experience E2E

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/windows-experience-e2e.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-windows-viewing:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build bundled JavaScript and test feature lifecycle
        shell: pwsh
        run: |
          node scripts/bundle_mods.js
          node scripts/test_viewing_experience.js
          node scripts/test_loader_mount_recovery.js
          node scripts/test_floating_player.js
          if ($LASTEXITCODE -ne 0) { throw 'JS_FEATURE_REGRESSION_FAILED' }
      - name: Compile real Windows executable with embedded mods
        shell: pwsh
        run: |
          python scripts/build_icon.py
          dotnet publish src/native/TizenTubeWindows.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false -o windows-experience-host
          if ($LASTEXITCODE -ne 0 -or !(Test-Path windows-experience-host/TizenTubeHost.exe)) {
            throw 'WINDOWS_EXE_BUILD_FAILED'
          }
      - name: Play YouTube and verify visible PiP, native controls, persisted cinema
        shell: pwsh
        run: |
          # A same-session PowerShell script can leave $LASTEXITCODE unset
          # even after all checks pass. Execute it as a child process so CI
          # sees the actual script exit status instead of a stale value.
          & pwsh -NoProfile -File ./scripts/ci_windows_experience.ps1 -Executable windows-experience-host/TizenTubeHost.exe -EvidenceDirectory windows-experience-evidence
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_REAL_VIDEO_E2E_FAILED' }
      - name: Preserve PASS or FAIL evidence from hosted Windows runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-youtube-experience-e2e
          path: windows-experience-evidence/**
          if-no-files-found: warn
          retention-days: 14
