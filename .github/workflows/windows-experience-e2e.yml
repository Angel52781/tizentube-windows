name: Windows Real Video and Viewing Experience E2E
# Both this workflow and windows-native-validation gate preview.12. The release
# must be bound to the exact SHA that passed both independent Windows runners.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/windows-experience-e2e.yml'
      - 'package.json'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-windows-viewing:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build bundled JavaScript and test feature lifecycle
        shell: pwsh
        run: |
          node scripts/bundle_mods.js
          node scripts/test_runtime.js
          node scripts/test_playback_failopen.js
          node scripts/test_ui_features.js
          node scripts/test_keyboard_shortcuts.js
          node scripts/test_hidpi_comments_ux.js
          node scripts/test_mods_fault_tolerance.js
          node scripts/test_live_injection_lifecycle.js
          node scripts/test_viewing_experience.js
          node scripts/test_navigation_and_persistence.js
          node scripts/test_loader_mount_recovery.js
          node scripts/test_floating_player.js
          node scripts/test_sponsored_feed.js
          node scripts/test_original_tv_parity.js
          node scripts/test_adblock_diagnostics.js
          node scripts/test_bundle.js
          node scripts/test_telemetry.js
          node scripts/test_ci_windows_experience_suite.js
          if ($LASTEXITCODE -ne 0) { throw 'JS_FEATURE_REGRESSION_FAILED' }
      - name: Compile real Windows executable with embedded mods
        shell: pwsh
        run: |
          python scripts/build_icon.py
          python scripts/test_windows_icon.py
          dotnet publish src/native/TizenTubeWindows.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false -o windows-experience-host
          if ($LASTEXITCODE -ne 0 -or !(Test-Path windows-experience-host/TizenTubeHost.exe)) {
            throw 'WINDOWS_EXE_BUILD_FAILED'
          }
      - name: Verify native Back toolbar and screenshot before playback journey
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/ci_windows_toolbar.ps1 -Executable windows-experience-host/TizenTubeHost.exe -EvidenceDirectory windows-toolbar-evidence
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_NATIVE_TOOLBAR_FAILED' }
      - name: Prove real home feed and two independently playable selected videos
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/ci_windows_navigation_playback.ps1 -Executable windows-experience-host/TizenTubeHost.exe -EvidenceDirectory windows-experience-evidence
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_REAL_MULTI_VIDEO_JOURNEY_FAILED' }
      - name: Press real Windows Arrow keys and Space inside WebView2
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/ci_windows_keyboard.ps1 -Executable windows-experience-host/TizenTubeHost.exe -EvidenceDirectory windows-experience-evidence
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_KEYBOARD_E2E_FAILED' }
      - name: Play YouTube and verify visible PiP, native controls, persisted cinema
        shell: pwsh
        run: |
          # A same-session PowerShell script can leave $LASTEXITCODE unset
          # even after all checks pass. Execute it as a child process so CI
          # sees the actual script exit status instead of a stale value.
          & pwsh -NoProfile -File ./scripts/ci_windows_experience.ps1 -Executable windows-experience-host/TizenTubeHost.exe -EvidenceDirectory windows-experience-evidence
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_REAL_VIDEO_E2E_FAILED' }
      - name: Validate P0 Normal -> Cinema -> Floating -> Fullscreen -> Return cycle
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./scripts/ci_windows_floating_cycle.ps1 -Executable windows-experience-host/TizenTubeHost.exe -EvidenceDirectory windows-experience-evidence/cycle
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_FLOATING_CYCLE_FAILED' }
      - name: Validate process-tree CPU and private RAM performance telemetry
        shell: pwsh
        run: |
          node scripts/measure_process_telemetry.js --validate windows-experience-evidence/floating-telemetry.json
          node scripts/measure_process_telemetry.js --validate windows-experience-evidence/theater-restart-telemetry.json
          if ($LASTEXITCODE -ne 0) { throw 'PERFORMANCE_TELEMETRY_VALIDATION_FAILED' }
      - name: Preserve PASS or FAIL evidence from hosted Windows runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-youtube-experience-e2e
          path: |
            windows-experience-evidence/**
            windows-toolbar-evidence/**
          if-no-files-found: warn
          retention-days: 14
