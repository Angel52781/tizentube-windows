name: Windows Native Host & CI Validation

on:
  push:
    branches:
      - main
      - 'ci/**'
      - ci/windows-native-validation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    name: Windows x64 Native Host & Telemetry Validation
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify JavaScript modules, runtime, and unit tests
        shell: pwsh
        run: |
          npm test
          node scripts/test_native_adblock_extension.js
          node scripts/test_external_ad_skip_helper.js
          node scripts/test_native_updater.js
          node scripts/test_sponsorblock_real_skip_path.js
          node scripts/test_playback_failopen.js
          node scripts/test_keyboard_shortcuts.js

      - name: Generate Windows application icon
        shell: pwsh
        run: |
          python scripts/build_icon.py
          if (!(Test-Path assets/TizenTube.ico)) { throw 'APP_ICON_MISSING' }
          python scripts/test_windows_icon.py

      - name: Verify PE32+ reproducible builder and bit-exact determinism
        shell: pwsh
        run: |
          python scripts/build_x64.py
          python scripts/verify_pe.py dist/TizenTube-win-x64/TizenTube.exe
          $hash1 = (Get-FileHash dist/TizenTube-win-x64/TizenTube.exe -Algorithm SHA256).Hash
          python scripts/build_x64.py
          $hash2 = (Get-FileHash dist/TizenTube-win-x64/TizenTube.exe -Algorithm SHA256).Hash
          if ($hash1 -ne $hash2) { throw "PE_BUILD_NOT_DETERMINISTIC: $hash1 != $hash2" }
          Write-Host "[OK] Bit-exact deterministic PE build verified ($hash1)" -ForegroundColor Green
          node scripts/test_host_integrity.js

      - name: Compile actual C# Windows host (x64 Release)
        shell: pwsh
        run: |
          dotnet publish src/native/TizenTubeWindows.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false -o windows-out
          if ($LASTEXITCODE -ne 0) { throw 'DOTNET_HOST_BUILD_FAILED' }
          if (!(Test-Path windows-out/TizenTubeHost.exe)) { throw 'NATIVE_HOST_EXE_MISSING' }

          New-Item -ItemType Directory -Path windows-out/app -Force | Out-Null
          foreach ($folder in @('mods','ui','runtime','core','extension')) {
            Copy-Item -Path "src/$folder" -Destination "windows-out/app/$folder" -Recurse -Force
          }
          $exe = Get-Item windows-out/TizenTubeHost.exe
          if ($exe.Length -lt 10000) { throw 'NATIVE_HOST_EXE_UNEXPECTEDLY_SMALL' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash

          New-Item -ItemType Directory -Path windows-out/telemetry -Force | Out-Null
          "HOST_EXE=$($exe.FullName)" | Out-File -FilePath windows-out/build-evidence.txt
          "SIZE=$($exe.Length)" | Out-File -FilePath windows-out/build-evidence.txt -Append
          "SHA256=$hash" | Out-File -FilePath windows-out/build-evidence.txt -Append
          "DOTNET_VERSION=8.0" | Out-File -FilePath windows-out/build-evidence.txt -Append
          "TIMESTAMP=$([DateTime]::UtcNow.ToString('o'))" | Out-File -FilePath windows-out/build-evidence.txt -Append
          Write-Host "[OK] Compiled native host: $hash ($($exe.Length) bytes)" -ForegroundColor Green

      # A single dark titlebar must replace the Windows caption, not stack
      # another row beneath it. Verify actual native window-state changes.
      - name: Verify integrated window titlebar, maximize and minimize
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/ci_windows_titlebar.ps1 -Executable windows-out/TizenTubeHost.exe -EvidenceDirectory windows-out/telemetry/titlebar
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATED_TITLEBAR_E2E_FAILED' }

      - name: Verify last video and theater preferences survive native process restart
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/ci_windows_session_reopen.ps1 -Executable windows-out/TizenTubeHost.exe -EvidenceDirectory windows-out/telemetry/session
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SESSION_REOPEN_FAILED' }

      - name: Execute Windows native host with process tree telemetry (multi-scenario)
        shell: pwsh
        run: |
          $hostExe = (Resolve-Path windows-out/TizenTubeHost.exe).Path

          Write-Host "`n>>> [SCENARIO 1] Executing Standard Native Host Startup Telemetry (20s)..." -ForegroundColor Cyan
          pwsh scripts/measure_memory.ps1 -ExePath $hostExe -DurationSeconds 20 -SamplingIntervalMs 1000 -OutputDir windows-out/telemetry/standard -Scenario "ci-standard-startup"
          if ($LASTEXITCODE -ne 0) { throw "PROCESS_TELEMETRY_STANDARD_FAILED" }
          if (!(Test-Path windows-out/telemetry/standard/memory-telemetry.json)) { throw "TELEMETRY_JSON_MISSING_STANDARD" }
          if (!(Test-Path windows-out/telemetry/standard/memory-summary.txt)) { throw "TELEMETRY_SUMMARY_MISSING_STANDARD" }

          # Copy primary telemetry to root telemetry directory for canonical referencing
          Copy-Item windows-out/telemetry/standard/* windows-out/telemetry/ -Force

          Write-Host "`n>>> [SCENARIO 2] Executing Headless Mode with Working Set Trimming Telemetry (20s)..." -ForegroundColor Cyan
          pwsh scripts/measure_memory.ps1 -ExePath $hostExe -DurationSeconds 20 -SamplingIntervalMs 1000 -OutputDir windows-out/telemetry/headless -Scenario "ci-headless-trim" -Headless
          if ($LASTEXITCODE -ne 0) { throw "PROCESS_TELEMETRY_HEADLESS_FAILED" }
          if (!(Test-Path windows-out/telemetry/headless/memory-telemetry.json)) { throw "TELEMETRY_JSON_MISSING_HEADLESS" }
          if (!(Test-Path windows-out/telemetry/headless/memory-summary.txt)) { throw "TELEMETRY_SUMMARY_MISSING_HEADLESS" }

      - name: Validate process tree telemetry and verify quality gates
        shell: pwsh
        run: |
          Write-Host ">>> Validating Scenario 1 (Standard) Telemetry Artifacts..." -ForegroundColor Cyan
          node scripts/measure_process_telemetry.js --validate windows-out/telemetry/standard/memory-telemetry.json
          if (Test-Path windows-out/telemetry/standard/host-internal-telemetry.json) {
            node scripts/measure_process_telemetry.js --validate windows-out/telemetry/standard/host-internal-telemetry.json
            $hostEvidence = Get-Content windows-out/telemetry/standard/host-internal-telemetry.json -Raw -Encoding utf8 | ConvertFrom-Json
            if ($hostEvidence.summary.modsInitializedCount -lt 1) { throw 'YOUTUBE_MOD_BUNDLE_NOT_EXECUTED' }
            if ($hostEvidence.summary.adblockRuntimeObserved -lt 1) { throw 'ADBLOCK_RUNTIME_NOT_ACTIVE_IN_WEBVIEW2' }
            if ($hostEvidence.summary.adblockStyleObserved -lt 1) { throw 'ADBLOCK_COSMETIC_STYLES_NOT_PRESENT_IN_WEBVIEW2' }
            Write-Host '[OK] AdBlock runtime and cosmetic styles verified inside real Windows WebView2'
          }
          Get-Content windows-out/telemetry/standard/memory-summary.txt

          Write-Host "`n>>> Validating Scenario 2 (Headless & Trim) Telemetry Artifacts..." -ForegroundColor Cyan
          node scripts/measure_process_telemetry.js --validate windows-out/telemetry/headless/memory-telemetry.json
          if (Test-Path windows-out/telemetry/headless/host-internal-telemetry.json) {
            node scripts/measure_process_telemetry.js --validate windows-out/telemetry/headless/host-internal-telemetry.json
          }
          Get-Content windows-out/telemetry/headless/memory-summary.txt

      - name: Upload validation evidence and telemetry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-host-validation
          path: |
            windows-out/build-evidence.txt
            windows-out/telemetry/**
            dist/TizenTube-win-x64/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build portable Windows x64 tester package (self-contained .NET)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'release-out/TizenTube-Windows-x64'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          dotnet publish src/native/TizenTubeWindows.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $pkg
          if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_NATIVE_HOST_BUILD_FAILED' }
          $exe = Join-Path $pkg 'TizenTubeHost.exe'
          if (!(Test-Path $exe)) { throw 'PORTABLE_HOST_EXE_MISSING' }
          if ((Get-Item $exe).Length -lt 10000000) { throw 'PORTABLE_HOST_NOT_SELF_CONTAINED' }
          if (Test-Path (Join-Path $pkg 'app')) { throw 'PACKAGE_APP_DIR_ALREADY_PRESENT' }
          $app = Join-Path $pkg 'app'
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          foreach ($folder in @('mods','ui','runtime','core','extension')) {
            Copy-Item -Path "src/$folder" -Destination (Join-Path $app $folder) -Recurse -Force
          }
          if (Test-Path (Join-Path $app 'native')) { throw 'BUILD_OUTPUT_LEAKED_INTO_APP_PACKAGE' }
          Copy-Item LICENSE (Join-Path $pkg 'LICENSE')
          Copy-Item docs/GETTING_STARTED_WINDOWS.md (Join-Path $pkg 'LEEME_INSTALACION.md')
          # The extension stays in the portable app, never installed in
          # global Edge/Windows. Verify the exact official GPLv3 build hash.
          & pwsh -NoProfile -File ./scripts/ci_package_ubol.ps1 -Destination (Join-Path $pkg 'extensions/ubol')
          if ($LASTEXITCODE -ne 0) { throw 'UBOL_PACKAGING_FAILED' }
          foreach ($required in @('app/mods/tizentube.bundle.js','app/ui/styles.css','app/extension/manifest.json','TizenTubeHost.exe','LICENSE','LEEME_INSTALACION.md')) {
            if (!(Test-Path (Join-Path $pkg $required))) { throw "PACKAGE_MISSING_REQUIRED_FILE_$required" }
          }
          # The self-contained single-file publish bundles native libraries for
          # extraction; WebView2Loader.dll is intentionally not a separate ZIP
          # entry. Prove this exact portable binary can launch WebView2.
          $smokePath = (Join-Path (Resolve-Path $pkg).Path 'portable-smoke.json')
          $portable = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--smoke-test','18','--telemetry-file',$smokePath) -PassThru -Wait
          if ($portable.ExitCode -ne 0) { throw "PORTABLE_HOST_EXIT_$($portable.ExitCode)" }
          if (!(Test-Path $smokePath)) { throw 'PORTABLE_HOST_TELEMETRY_MISSING' }
          $smoke = Get-Content $smokePath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($smoke.summary.modsInitializedCount -lt 1) { throw 'PORTABLE_MODS_NOT_RUNNING' }
          if ($smoke.summary.ubolExtensionEnabled -lt 1) { throw 'PORTABLE_UBOL_BROWSER_EXTENSION_NOT_ENABLED' }
          if ($smoke.summary.ubolYoutubeFilteringMode -ne 3 -or $smoke.summary.ubolBroadHostPermission -ne 1) {
            throw 'PORTABLE_UBOL_YOUTUBE_COMPLETE_FILTERING_NOT_VERIFIED'
          }
          $addonEvidence = Join-Path (Resolve-Path $pkg).Path 'extension-enabled-evidence.json'
          $addonProbe = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--smoke-test','12','--adblock-extension-probe','--telemetry-file',$addonEvidence) -Wait -PassThru
          if ($addonProbe.ExitCode -ne 0 -or !(Test-Path $addonEvidence)) { throw 'UBOL_WEBVIEW2_EXTENSION_PROBE_FAILED' }
          $addon = Get-Content $addonEvidence -Raw -Encoding utf8 | ConvertFrom-Json
          if ($addon.summary.ubolExtensionEnabled -ne 1) { throw 'UBOL_WEBVIEW2_INSTALLATION_NOT_ATTESTED' }
          if ($addon.summary.ubolYoutubeFilteringMode -ne 3 -or $addon.summary.ubolBroadHostPermission -ne 1) {
            throw 'UBOL_WEBVIEW2_HOST_PERMISSIONS_AND_MODE_NOT_VERIFIED'
          }
          Copy-Item $addonEvidence 'release-out/extension-enabled-evidence.json' -Force
          Copy-Item $smokePath 'release-out/portable-smoke-evidence.json' -Force
          Remove-Item $smokePath -Force
          Write-Host '[OK] Self-contained portable host and bundled WebView2Loader verified by execution'
          # CRITICAL regression: user moved only TizenTubeHost.exe onto the
          # Desktop. Previous builds silently omitted AdBlock/SponsorBlock.
          # Prove this very same EXE works with NO app/ sibling folder.
          $singleDir = Join-Path $env:RUNNER_TEMP 'TizenTube-EXE-Only'
          New-Item -ItemType Directory -Path $singleDir -Force | Out-Null
          $singleExe = Join-Path $singleDir 'TizenTubeHost.exe'
          Copy-Item $exe $singleExe -Force
          if (Test-Path (Join-Path $singleDir 'app')) { throw 'STANDALONE_TEST_NOT_ISOLATED' }
          $singleTelemetry = Join-Path $singleDir 'single-exe-smoke.json'
          $singleHost = Start-Process -FilePath $singleExe -WorkingDirectory $singleDir -ArgumentList @('--smoke-test','22','--telemetry-file',$singleTelemetry) -PassThru -Wait
          if ($singleHost.ExitCode -ne 0) { throw "STANDALONE_HOST_EXIT_$($singleHost.ExitCode)" }
          if (!(Test-Path $singleTelemetry)) { throw 'STANDALONE_TELEMETRY_MISSING' }
          $single = Get-Content $singleTelemetry -Raw -Encoding utf8 | ConvertFrom-Json
          if ($single.summary.modsInitializedCount -lt 1) { throw 'STANDALONE_MODS_NOT_LOADED' }
          if ($single.summary.adblockRuntimeObserved -lt 1) { throw 'STANDALONE_ADBLOCK_NOT_LOADED' }
          if ($single.summary.adblockStyleObserved -lt 1) { throw 'STANDALONE_COSMETIC_NOT_LOADED' }
          Copy-Item $singleTelemetry 'release-out/standalone-exe-smoke-evidence.json' -Force
          Write-Host '[OK] A lone TizenTubeHost.exe boots WebView2 with full embedded bundle and styles'
          # Native display E2E: borderless fullscreen must cover the full
          # monitor (not the taskbar work area) and restore original bounds.
          $windowEvidence = Join-Path (Resolve-Path $pkg).Path 'window-cycle-evidence.json'
          $windowCycle = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--smoke-test','13','--window-cycle-test','--telemetry-file',$windowEvidence) -PassThru -Wait
          if ($windowCycle.ExitCode -ne 0) { throw "WINDOW_CYCLE_EXE_EXIT_$($windowCycle.ExitCode)" }
          $windowSummary = (Get-Content $windowEvidence -Raw -Encoding utf8 | ConvertFrom-Json).summary
          if ($windowSummary.windowFullMonitorPass -ne 1 -or $windowSummary.windowRestorePass -ne 1 -or $windowSummary.windowCyclePass -ne 1) {
            throw 'WINDOW_FULLSCREEN_RESTORE_E2E_FAILED'
          }
          Copy-Item $windowEvidence 'release-out/window-cycle-evidence.json' -Force
          Remove-Item $windowEvidence -Force
          # WinForms-native floating player geometry and exact window restore
          # without relying on the unsupported Chromium PiP API in WebView2.
          $floatingEvidence = Join-Path (Resolve-Path $pkg).Path 'floating-window-cycle-evidence.json'
          $floatTest = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--smoke-test','13','--floating-window-test','--telemetry-file',$floatingEvidence) -PassThru -Wait
          if ($floatTest.ExitCode -ne 0) { throw "FLOATING_WINDOW_HOST_EXIT_$($floatTest.ExitCode)" }
          $floatingResult = (Get-Content $floatingEvidence -Raw -Encoding utf8 | ConvertFrom-Json).summary
          if ($floatingResult.floatingWindowCyclePass -ne 1) { throw 'FLOATING_WINDOW_CYCLE_E2E_FAILED' }
          Copy-Item $floatingEvidence 'release-out/floating-window-cycle-evidence.json' -Force
          Remove-Item $floatingEvidence -Force
          # A cold restart must retain both normal window bounds and the
          # maximized state. Isolate test data from the runner's WebView2 login
          # profile and reject a success based on a single process lifetime.
          $env:TIZENTUBE_TEST_PLACEMENT_DIR = Join-Path $env:RUNNER_TEMP 'tt-window-placement-e2e'
          New-Item -ItemType Directory -Path $env:TIZENTUBE_TEST_PLACEMENT_DIR -Force | Out-Null
          $placementFile = Join-Path $env:TIZENTUBE_TEST_PLACEMENT_DIR 'window-placement.json'
          if (Test-Path $placementFile) { Remove-Item $placementFile -Force }
          $firstPlacementEvidence = Join-Path (Resolve-Path $pkg).Path 'window-placement-first.json'
          $firstPlacement = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--smoke-test','12','--window-placement-test','--telemetry-file',$firstPlacementEvidence) -PassThru -Wait
          if ($firstPlacement.ExitCode -ne 0 -or !(Test-Path $placementFile)) { throw 'WINDOW_PLACEMENT_NOT_PERSISTED' }
          $storedPlacement = Get-Content $placementFile -Raw -Encoding utf8 | ConvertFrom-Json
          if ($storedPlacement.width -ne 900 -or $storedPlacement.height -ne 560 -or !$storedPlacement.maximized) { throw 'WINDOW_PLACEMENT_WRONG_GEOMETRY' }
          $secondPlacementEvidence = Join-Path (Resolve-Path $pkg).Path 'window-placement-second.json'
          $secondPlacement = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--smoke-test','12','--window-placement-test','--telemetry-file',$secondPlacementEvidence) -PassThru -Wait
          if ($secondPlacement.ExitCode -ne 0) { throw 'WINDOW_PLACEMENT_RESTART_FAILED' }
          $secondSummary = (Get-Content $secondPlacementEvidence -Raw -Encoding utf8 | ConvertFrom-Json).summary
          if ($secondSummary.windowPlacementRestored -ne 1) { throw 'WINDOW_PLACEMENT_NOT_RESTORED_AFTER_RESTART' }
          Copy-Item $secondPlacementEvidence 'release-out/window-placement-restart-evidence.json' -Force
          Remove-Item Env:TIZENTUBE_TEST_PLACEMENT_DIR
          # Regression reported on physical Windows: Ctrl+Shift+P launched
          # Edge WebView2 Print despite passing purely structural CI. Send the
          # actual keyboard chord and require WM_HOTKEY evidence on Windows.
          $keyEvidence = Join-Path (Resolve-Path $pkg).Path 'floating-hotkey-evidence.json'
          $keyTest = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--smoke-test','12','--floating-hotkey-test','--telemetry-file',$keyEvidence) -PassThru -Wait
          if ($keyTest.ExitCode -ne 0 -or !(Test-Path $keyEvidence)) { throw 'FLOATING_HOTKEY_KEYBOARD_E2E_FAILED' }
          $keySummary = (Get-Content $keyEvidence -Raw -Encoding utf8 | ConvertFrom-Json).summary
          if ($keySummary.floatingHotKeyWindowsTriggered -lt 1) { throw 'FLOATING_HOTKEY_NOT_RECEIVED_BY_WINDOWS' }
          Copy-Item $keyEvidence 'release-out/floating-hotkey-evidence.json' -Force
          Remove-Item $keyEvidence -Force
          # Research-only probe. WebView2 != Cobalt; an exit code 0 is not
          # proof that YouTube TV works or ad-free playback is available.
          $tvProbe = Join-Path (Resolve-Path $pkg).Path 'experimental-tv-smoke.json'
          $tv = Start-Process -FilePath (Resolve-Path $exe).Path -WorkingDirectory (Resolve-Path $pkg).Path -ArgumentList @('--tv','--smoke-test','16','--telemetry-file',$tvProbe) -PassThru -Wait
          if ($tv.ExitCode -ne 0) {
            Write-Warning "EXPERIMENTAL_TV_MODE_NOT_READY: exit $($tv.ExitCode)"
          } elseif (Test-Path $tvProbe) {
            $tvEvidence = Get-Content $tvProbe -Raw -Encoding utf8 | ConvertFrom-Json
            Write-Host "EXPERIMENTAL_TV_SMOKE_ONLY mods=$($tvEvidence.summary.modsInitializedCount); playback NOT verified"
            Copy-Item $tvProbe 'release-out/experimental-tv-smoke-evidence.json' -Force
          }
          if (Test-Path $tvProbe) { Remove-Item $tvProbe -Force }
          $exeSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "TizenTubeHost.exe SHA256=$exeSha" | Set-Content (Join-Path $pkg 'CHECKSUMS.txt')
          "Commit=$env:GITHUB_SHA" | Add-Content (Join-Path $pkg 'CHECKSUMS.txt')
          # Check that the full packaged .NET app can run after the updater
          # copies it outside the original install path; EXE-only broke prior
          # versions. This is a real process launch, not a static assertion.
          & (Join-Path $pkg 'TizenTubeHost.exe') --verify-detached-updater-host $pkg
          if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_UPDATER_DETACHED_HOST_CANNOT_START' }
          # Test transactional replacement in a disposable renamed portable
          # folder; verifies backup and restoration without touching users.
          & (Join-Path $pkg 'TizenTubeHost.exe') --verify-in-place-updater
          if ($LASTEXITCODE -ne 0) { throw 'PORTABLE_IN_PLACE_UPDATE_FAILED' }
          $zip = 'release-out/TizenTube-Windows-x64-v0.1.0-preview.20.zip'
          Compress-Archive -Path $pkg -DestinationPath $zip -CompressionLevel Optimal -Force
          if (!(Test-Path $zip)) { throw 'PORTABLE_ZIP_MISSING' }
          $zipSha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipSha  $(Split-Path $zip -Leaf)" | Set-Content 'release-out/SHA256SUMS.txt'
          Write-Host "PREVIEW_PACKAGE=$(Split-Path $zip -Leaf)"
          Write-Host "PREVIEW_ZIP_SHA256=$zipSha"
          Write-Host "PORTABLE_HOST_SHA256=$exeSha"

      - name: Upload portable tester ZIP and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: tizentube-windows-x64-portable-preview
          path: |
            release-out/TizenTube-Windows-x64-v0.1.0-preview.20.zip
            release-out/SHA256SUMS.txt
            release-out/portable-smoke-evidence.json
            release-out/standalone-exe-smoke-evidence.json
            release-out/floating-window-cycle-evidence.json
            release-out/window-placement-restart-evidence.json
            release-out/floating-hotkey-evidence.json
            release-out/window-cycle-evidence.json
            release-out/experimental-tv-smoke-evidence.json
            release-out/extension-enabled-evidence.json
          if-no-files-found: error
          retention-days: 14
